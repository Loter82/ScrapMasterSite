  <rect x="60" y="56" width="90" height="30" rx="8" fill="rgba(255,212,59,0.15)"/>
  <text x="76" y="75" fill="#ffd43b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1">ВИБІР</text>

  <text x="60" y="190" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Яку програму</text>
  <text x="60" y="248" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">обрати для пункту</text>
  <text x="60" y="306" fill="#ffd43b" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">прийому у 2026</text>

