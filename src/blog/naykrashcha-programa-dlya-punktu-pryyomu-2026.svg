    <text x="35" y="205" fill="#ffd43b" font-family="'Oswald', sans-serif" font-size="30" font-weight="700" text-anchor="middle">2</text>
    <rect x="80" y="90" width="70" height="150" rx="8" fill="rgba(255,212,59,0.2)" stroke="#ffd43b" stroke-width="2"/>
