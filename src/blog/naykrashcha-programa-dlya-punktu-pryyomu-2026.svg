    <rect x="160" y="180" width="70" height="60" rx="8" fill="rgba(255,212,59,0.08)" stroke="#ffd43b" stroke-width="2"/>
    <text x="195" y="220" fill="#ffd43b" font-family="'Oswald', sans-serif" font-size="26" font-weight="700" text-anchor="middle">3</text>
    <!-- star above bar 1 -->
    <path d="M115 20 L124 42 L148 44 L130 60 L136 84 L115 71 L94 84 L100 60 L82 44 L106 42 Z" fill="#ffd43b"/>
